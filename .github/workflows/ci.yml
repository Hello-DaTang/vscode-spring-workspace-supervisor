name: Build and Release VSIX

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Package VS Code extension
        run: npm run package
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-${{ github.sha }}
          path: '*.vsix'
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download packaged VSIX
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension-${{ github.sha }}
          path: release-assets
      - name: Read extension version and normalize asset name
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          SOURCE_VSIX="$(find release-assets -maxdepth 1 -type f -name '*.vsix' -print -quit)"
          if [ -z "$SOURCE_VSIX" ]; then
            echo "No VSIX package found" >&2
            exit 1
          fi
          ASSET="spring-workspace-supervisor-${TAG}.vsix"
          mv "$SOURCE_VSIX" "release-assets/$ASSET"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
      - name: Create versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
          ASSET: ${{ steps.metadata.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping publication." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "Increase package.json version to publish a new release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh release create "$TAG" "release-assets/$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Spring Workspace Supervisor $TAG" \
            --generate-notes \
            --latest

          echo "Published **Spring Workspace Supervisor $TAG**." >> "$GITHUB_STEP_SUMMARY"
          echo "Download **$ASSET** from the repository Releases page and install it with VS Code's **Install from VSIX...** command." >> "$GITHUB_STEP_SUMMARY"
