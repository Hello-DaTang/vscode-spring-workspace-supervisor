name: Apply v0.5.0 Migration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-v050.mjs'
      - '.github/workflows/apply-v050.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check migration state
        id: state
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" = "0.5.0" ]; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply migration
        if: steps.state.outputs.applied == 'false'
        run: node scripts/apply-v050.mjs
      - name: Install dependencies
        if: steps.state.outputs.applied == 'false'
        run: npm install --no-audit --no-fund
      - name: Validate migration
        if: steps.state.outputs.applied == 'false'
        run: npm test
      - name: Commit migrated source
        if: steps.state.outputs.applied == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md README.md
          git commit -m "Release Spring Workspace Supervisor v0.5.0"
          git push
