name: Build Spring Boot Tools Root-Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-spring-tools-root-fix.py'
      - '.github/workflows/build-spring-tools-rootfix.yml'

permissions:
  contents: read

concurrency:
  group: spring-tools-rootfix-v2.4.2
  cancel-in-progress: false

env:
  UPSTREAM_COMMIT: adc5531cf69e2d629e792539025a4e22c273a5e2
  PATCHED_VERSION: 2.4.2
  RELEASE_TAG: spring-tools-rootfix-v2.4.2-r2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned Spring Tools source
        shell: bash
        run: |
          set -euo pipefail
          git init spring-tools
          git -C spring-tools remote add origin https://github.com/spring-projects/spring-tools.git
          git -C spring-tools fetch --depth 1 origin "$UPSTREAM_COMMIT"
          git -C spring-tools checkout --detach FETCH_HEAD

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'spring-tools/**/pom.xml'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply audited root-fix patch
        run: python3 scripts/apply-spring-tools-root-fix.py spring-tools

      - name: Verify patched semantics
        shell: bash
        run: |
          set -euo pipefail
          CACHE='spring-tools/headless-services/spring-boot-language-server/src/main/java/org/springframework/ide/vscode/boot/jdt/ls/JdtLsProjectCache.java'
          PACKAGE='spring-tools/vscode-extensions/vscode-spring-boot/package.json'
          grep -q 'without a destructive registration timeout' "$CACHE"
          ! grep -q 'INITIALIZE_TIMEOUT' "$CACHE"
          test "$(node -p "require('./$PACKAGE').version")" = "$PATCHED_VERSION"
          test "$(node -p "require('./$PACKAGE').rootFixBuild.patch")" = 'classpath-listener-backpressure-v2'

      - name: Build Spring Boot language server and VSIX
        shell: bash
        working-directory: spring-tools/vscode-extensions/vscode-spring-boot
        run: |
          set -euo pipefail
          chmod +x scripts/preinstall.sh
          chmod +x ../../headless-services/spring-boot-language-server/build.sh
          chmod +x ../../headless-services/spring-boot-language-server/remove-signatures.sh
          ./scripts/preinstall.sh
          npm install --no-audit --no-fund
          npm run check-types
          npm run vsce-package

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          SOURCE_VSIX="$(find spring-tools/vscode-extensions/vscode-spring-boot -maxdepth 1 -type f -name '*.vsix' -print -quit)"
          test -n "$SOURCE_VSIX"
          cp "$SOURCE_VSIX" "release-assets/spring-boot-tools-rootfix-${PATCHED_VERSION}.vsix"
          cp scripts/apply-spring-tools-root-fix.py release-assets/
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: spring-boot-tools-rootfix-${{ env.PATCHED_VERSION }}
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spring-boot-tools-rootfix-${{ env.PATCHED_VERSION }}
          path: release-assets

      - name: Publish root-fix release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; replacing its assets."
            gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi

          cat > release-notes.md <<'EOF'
          ## Unofficial Spring Boot Tools root-fix build — backpressure fix v2

          This VSIX is built from pinned `spring-projects/spring-tools` source and retains the extension ID `vmware.vscode-spring-boot`, so the official Spring Boot Dashboard dependency continues to work.

          Root-fix changes:

          - removes the destructive wall-clock timeout around initial JDT classpath-listener registration;
          - keeps the callback command registered while large initial classpath snapshots are still streaming;
          - reports classpath listening as available during that initial stream so Spring project indexing can proceed;
          - handles genuine terminal errors explicitly, preventing Reactor `onErrorDropped`;
          - performs idempotent cleanup only on genuine failure, explicit disable, or shutdown.

          This supersedes the `2.4.1-r1` build, whose three-minute timeout could unregister the callback command while JDT still had queued classpath events. That failure produced `command 'sts4.classpath.*' not found` and empty nested Beans/Endpoint Mappings.

          Install this VSIX with `--force`. It replaces the Marketplace Spring Boot Tools installation. Disable automatic updates for Spring Boot Tools while testing this build.
          EOF

          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Spring Boot Tools Root-Fix ${PATCHED_VERSION} (r2)" \
            --notes-file release-notes.md
