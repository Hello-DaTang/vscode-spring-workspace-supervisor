name: Apply v0.5.1 Cleanup

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-v051.mjs'
      - '.github/workflows/apply-v051.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spring-supervisor-manifest-cleanup-v051
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check migration state
        id: state
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" = "0.5.1" ]; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply cleanup
        if: steps.state.outputs.applied == 'false'
        run: node scripts/apply-v051.mjs
      - name: Verify native Ctrl+T manifest
        if: steps.state.outputs.applied == 'false'
        run: |
          node - <<'NODE'
          const p = require('./package.json');
          if ((p.contributes.commands || []).some(x => x.command === 'springSupervisor.goToSymbolOrEndpoint')) process.exit(1);
          if ((p.contributes.keybindings || []).some(x => x.command === 'springSupervisor.goToSymbolOrEndpoint')) process.exit(1);
          if (p.contributes.configuration.properties['springSupervisor.overrideCtrlT']) process.exit(1);
          NODE
      - name: Install dependencies
        if: steps.state.outputs.applied == 'false'
        run: npm install --no-audit --no-fund
      - name: Validate TypeScript and tests
        if: steps.state.outputs.applied == 'false'
        run: npm test
      - name: Commit cleaned release source
        if: steps.state.outputs.applied == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md README.md
          git commit -m "Release Spring Workspace Supervisor v0.5.1"
          git push
